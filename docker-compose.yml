services:
  postgres:
    image: postgres:16
    container_name: zpwj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tartak
      POSTGRES_USER: zpwj
      POSTGRES_PASSWORD: zpwj
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: